<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World TG Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-main: #0b0b0e;
      --card-bg: #14141a;
      --card-hover: #1c1c26;
      --border-color: rgba(139, 92, 246, 0.15);
      --accent-primary: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --accent-success: #10b981;
      --accent-danger: #ef4444;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      padding-bottom: 110px;
      -webkit-tap-highlight-color: transparent;
    }

    * {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
    }

    .tab-content { display: none; opacity: 0; transform: translateY(8px); }
    .tab-content.active { display: block; opacity: 1; transform: translateY(0); }

    .card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    .hero-balance {
      background: linear-gradient(135deg, #3b1875 0%, #180a3a 100%);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 50px rgba(139, 92, 246, 0.3);
      border: 1px solid rgba(167, 139, 250, 0.3);
      margin-bottom: 16px;
    }

    .btn-main {
      background: var(--accent-primary);
      color: #fff;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--accent-glow);
      width: 100%;
      text-align: center;
      margin-top: 8px;
      text-decoration: none;
      display: inline-block;
    }
    .btn-main:active { transform: scale(0.97); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      width: 100%;
      text-align: center;
      margin-bottom: 8px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(11, 11, 14, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 12px 6px 24px;
      z-index: 1000;
    }
    .nav-item {
      background: none; border: none;
      color: var(--text-muted);
      font-size: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      flex: 1; cursor: pointer;
    }
    .nav-item.active { color: var(--accent-primary); }

    input, select, textarea {
      width: 100%; background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color); border-radius: 12px;
      padding: 10px 14px; color: #fff;
      margin-top: 4px; margin-bottom: 12px; outline: none;
    }
  </style>
</head>
<body>

  <!-- Витрина -->
  <div id="tab-shop" class="tab-content active">
    <h2 style="margin-top:0;">Витрина товаров</h2>
    <div id="products-list">
      <div class="card">
        <h3>Telegram Premium (1 год)</h3>
        <p style="color: var(--text-muted); font-size: 13px;">Официальная подписка на ваш аккаунт</p>
        <div style="font-size: 18px; font-weight: bold; color: var(--accent-primary); margin-bottom: 12px;">1500 ₽</div>
        <button class="btn-main" onclick="buyItem('Telegram Premium')">Купить</button>
      </div>
    </div>
  </div>

  <!-- Профиль -->
  <div id="tab-profile" class="tab-content">
    <div class="hero-balance">
      <span style="font-size:12px; color:var(--text-muted);">Ваш баланс</span>
      <h1 id="user-balance" style="margin: 4px 0 0 0;">0.00 ₽</h1>
    </div>
    <div class="card">
      <h3>Пополнить через Crypto Bot</h3>
      <label style="font-size: 12px; color: var(--text-muted);">Сумма пополнения (USDT)</label>
      <input type="number" id="deposit-amount" value="5" min="1">
      <button class="btn-main" id="btn-pay" onclick="createCryptoInvoice()">Оплатить в Crypto Bot</button>
    </div>
  </div>

  <!-- Продавец -->
  <div id="tab-seller" class="tab-content">
    <h2>Кабинет продавца</h2>
    <div class="card">
      <h3>Разместить товар</h3>
      <label>Название</label>
      <input type="text" id="p-name" placeholder="Введите название">
      <label>Цена (руб.)</label>
      <input type="number" id="p-price" placeholder="500">
      <button class="btn-main" onclick="addProd()">Добавить</button>
    </div>
  </div>

  <!-- Админ -->
  <div id="tab-admin" class="tab-content">
    <h2>Панель администратора</h2>
    <div class="card">
      <p style="color: var(--text-muted); font-size: 13px;">Управление системой и мониторинг активных сессий.</p>
    </div>
  </div>

  <!-- Нижняя навигация -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('shop', this)">
      <span>🛍️</span><span>Витрина</span>
    </button>
    <button class="nav-item" onclick="switchTab('profile', this)">
      <span>👤</span><span>Профиль</span>
    </button>
    <button class="nav-item" onclick="switchTab('seller', this)">
      <span>🏪</span><span>Продавец</span>
    </button>
    <button class="nav-item" onclick="switchTab('admin', this)">
      <span>⚡</span><span>Админ</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if(tg) tg.expand();

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      if(el) el.classList.add('active');
    }

    function buyItem(name) {
      if(tg) tg.showAlert('Запрос на покупку: ' + name);
    }

    async function createCryptoInvoice() {
      const amountInput = document.getElementById('deposit-amount');
      const amount = parseFloat(amountInput.value);
      const btn = document.getElementById('btn-pay');

      if (!amount || amount <= 0) {
        if(tg) tg.showAlert('Укажите корректную сумму');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Создание счета...';

      try {
        const response = await fetch('/api/create-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount, asset: 'USDT' })
        });

        const data = await response.json();

        if (data.success && data.payUrl) {
          if (tg && tg.openTelegramLink) {
            tg.openTelegramLink(data.payUrl);
          } else {
            window.location.href = data.payUrl;
          }
        } else {
          if(tg) tg.showAlert('Ошибка: ' + (data.error || 'Не удалось создать счет'));
        }
      } catch (e) {
        if(tg) tg.showAlert('Ошибка сети при запросе к серверу');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Оплатить в Crypto Bot';
      }
    }

    function addProd() {
      if(tg) tg.showAlert('Товар отправлен на проверку!');
    }
  </script>
</body>
</html>
